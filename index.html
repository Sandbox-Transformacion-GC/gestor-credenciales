<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content-Security-Policy restrictiva (respaldo vía <meta>; la versión real que aplica el
      navegador va como cabecera HTTP en vercel.json — un <meta> no puede imponer
      frame-ancestors, por eso también está ahí):
      - script-src/style-src: solo el propio origen (los estilos inline de Vite en dev quedan
        permitidos por 'unsafe-inline' solo para style, necesario por cómo Vite inyecta CSS).
      - connect-src: 'self' + el dominio exacto de este proyecto de Supabase (si alguna vez
        cambias de proyecto de Supabase, actualiza este dominio aquí Y en vercel.json).
      - object-src/base-uri: bloqueados por completo.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://wibkzheavbyjxiwctkxz.supabase.co; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self';"
    />
    <title>Gestor de Credenciales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
