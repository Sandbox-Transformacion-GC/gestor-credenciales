<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Content-Security-Policy restrictiva (respaldo vía <meta> para cuando se corre local con
      `vite preview` o similar; la versión que de verdad protege en producción va como cabecera
      HTTP en vercel.json).
      - script-src/style-src: solo el propio origen (los estilos inline de Vite en dev quedan
        permitidos por 'unsafe-inline' solo para style, necesario por cómo Vite inyecta CSS).
      - connect-src: 'self' + el dominio exacto de este proyecto de Supabase, en https: (API
        normal) Y wss: (WebSocket, lo usa Realtime) — son esquemas distintos, hay que permitir
        los dos. Si alguna vez cambias de proyecto de Supabase, actualiza este dominio aquí Y en
        vercel.json.
      - object-src/base-uri: bloqueados por completo.
      - frame-ancestors NO se pone aquí: los navegadores la ignoran (con warning en consola)
        cuando la CSP viene por <meta>, solo funciona como cabecera HTTP — por eso vive
        únicamente en vercel.json, que es donde sí aplica de verdad.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://wibkzheavbyjxiwctkxz.supabase.co wss://wibkzheavbyjxiwctkxz.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self';"
    />
    <title>Gestor de Credenciales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
